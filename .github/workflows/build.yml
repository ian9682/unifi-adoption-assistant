name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only to create releases on tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) }
          else { $v = "0.0.0-ci.$env:GITHUB_RUN_NUMBER" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # Optional code signing: add repository secrets SIGNING_CERT_PFX_BASE64 and SIGNING_CERT_PASSWORD.
      - name: Test, publish and package
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $sign = @{}
          if ($env:CERT_B64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
            $sign = @{ CertificatePath = $pfx; CertificatePassword = (ConvertTo-SecureString $env:CERT_PASSWORD -AsPlainText -Force) }
          }
          ./build/publish.ps1 -Version '${{ steps.version.outputs.value }}' @sign

      - uses: actions/upload-artifact@v6
        with:
          name: UniFiAdoptionAssistant-${{ steps.version.outputs.value }}
          path: artifacts/*.*

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create $env:GITHUB_REF_NAME
          artifacts/UniFiAdoptionAssistant-Setup.exe
          artifacts/UniFiAdoptionAssistant-win-x86.zip
          artifacts/SHA256SUMS.txt
          --title "UniFi Adoption Assistant $env:GITHUB_REF_NAME"
          --generate-notes
